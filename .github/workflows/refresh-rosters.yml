name: Refresh current NHL records
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: roster-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/update-rosters.py --refresh-current
      - run: npm test
      - name: Save the new snapshot and request a Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/rosters.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rosters.json
          git commit -m 'Refresh current NHL roster snapshot'
          git push
          gh api --method POST repos/${{ github.repository }}/pages/builds
