name: Test Ice Time
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Check browser gameplay and responsive layout
        run: |
          python3 -m http.server 8000 &
          node qa/browser.cjs
          node qa/confetti.cjs
          node qa/loading.cjs
          python3 -m http.server 8001 --directory dist &
          QA_BASE_URL=http://localhost:8001 node qa/browser.cjs
          QA_BASE_URL=http://localhost:8001 node qa/confetti.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-preview
          path: "*-preview.png"
