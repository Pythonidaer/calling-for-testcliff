name: Test Ice Time
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check browser gameplay and responsive layout
        run: |
          python3 -m http.server 8000 &
          node qa/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-preview
          path: mobile-preview.png
