name: Test and deploy Ice Time
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check browser gameplay and responsive layout
        run: |
          python3 -m http.server 8000 &
          node qa/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-preview
          path: mobile-preview.png
      - name: Assemble public files
        run: |
          mkdir public
          cp index.html styles.css app.js game.js roster.js icon.svg public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
